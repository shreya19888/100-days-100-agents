      <circle cx="18" cy="19.2" r="1.1" fill="#C49A3A" opacity="0.55"/>
    </g>
    <g transform="translate(118 22) rotate(18)">
      <path d="M18 4c8 10 8 22 0 32-8-10-8-22 0-32Z"/>
