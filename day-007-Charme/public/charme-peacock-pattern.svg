      <ellipse cx="18" cy="20" rx="2.8" ry="3.6" fill="#66735A" opacity="0.4"/>
      <circle cx="18" cy="19.2" r="1.1" fill="#C49A3A" opacity="0.5"/>
    </g>
    <g transform="translate(178 78) rotate(-12)">
